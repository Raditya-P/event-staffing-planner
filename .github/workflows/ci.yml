name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest

  docker:
    # Builds the production image, checks that it starts and serves requests, and (on main, once the
    # registry is connected with deploy/azure.ps1 -ConnectGitHub) uploads it to the Azure registry.
    needs: test
    runs-on: ubuntu-latest
    env:
      ACR: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t forecast-mcp .
      - name: Start the container and smoke-test it
        run: |
          docker run -d --name app -p 8000:8000 -e DATABASE_URL=sqlite:////tmp/smoke.db -e ENGINE_PROFILE=light -e AUTH_MODE=none -e DEV_ROUTES=0 forecast-mcp
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/events | python3 -c "import sys, json; e = json.load(sys.stdin); assert len(e) == 2, e; print('events ok')"
          curl -fs http://127.0.0.1:8000/ > /dev/null
          echo "dashboard ok"
      - name: Container logs
        if: always()
        run: docker logs app | tail -40
      - name: Upload to the Azure container registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.ACR != ''
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          echo "$ACR_PASSWORD" | docker login "$ACR" --username "$ACR_USERNAME" --password-stdin
          docker tag forecast-mcp "$ACR/forecast-mcp:$GITHUB_SHA"
          docker push "$ACR/forecast-mcp:$GITHUB_SHA"
          echo "Uploaded $ACR/forecast-mcp:$GITHUB_SHA"
