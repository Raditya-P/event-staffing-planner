<!doctype html>
<html lang="en" data-theme="planner">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Event Staffing Planner</title>
<style>
/*__APP_CSS__*/
html, body { background: transparent; }
</style>
</head>
<body>
<div id="app" class="fc-root space-y-3 p-3"><div class="flex items-center gap-2 text-sm"><span class="loading loading-dots loading-sm"></span>Loading…</div></div>
<script>
/*__CHARTS_JS__*/
</script>
<script type="module">
import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@2.0.3/app-with-deps";

const { h, fmt, fmt1, eur, pct } = window.FC;
const root = document.getElementById("app");
const app = new App({ name: "Event Staffing Planner", version: "0.2.0" });
let current = null;      // last structured payload
let pollTimer = null;
let gate = "all";

function applyContext(ctx) {
  if (!ctx) return;
  // Follow the chat's light/dark mode with the website's two themes.
  if (ctx.theme) document.documentElement.dataset.theme = ctx.theme === "dark" ? "planner-dark" : "planner";
  const ins = ctx.safeAreaInsets;
  if (ins) root.style.padding = `${12 + ins.top}px ${12 + ins.right}px ${12 + ins.bottom}px ${12 + ins.left}px`;
}

function textOf(result) {
  return (result.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
}

async function call(name, args) {
  const result = await app.callServerTool({ name, arguments: args });
  if (result.isError) throw new Error(textOf(result) || "The request was rejected by the server.");
  return result.structuredContent;
}

async function tellClaude(text) {
  // Keeps Claude's picture of the conversation current; the planner sees it in the next turn.
  try { await app.updateModelContext({ content: [{ type: "text", text }] }); } catch (e) { /* host may not support it */ }
}

function header(title, meta, badge, badgeCls) {
  const head = h("div", { class: "flex flex-wrap items-start justify-between gap-2" }, root);
  const left = h("div", {}, head);
  h("h2", { class: "text-lg font-bold leading-tight" }, left, title);
  if (meta) h("div", { class: "text-xs text-base-content/70" }, left, meta);
  if (badge) h("span", { class: `badge badge-sm ${badgeCls || "badge-ghost"}` }, head, badge);
}
function alertBox(parent, text, kind) {
  const el = h("div", { role: kind === "error" ? "alert" : "status", class: `alert alert-soft text-sm ${kind === "error" ? "alert-error" : kind === "ok" ? "alert-success" : kind === "warn" ? "alert-warning" : ""}`.trim() }, parent);
  h("span", {}, el, text);
  return el;
}
function cardBody(parent, cls) {
  const c = h("div", { class: `card bg-base-100 border border-base-300 ${cls || ""}`.trim() }, parent);
  return h("div", { class: "card-body gap-2 p-4" }, c);
}
function button(parent, text, cls, onClick) {
  const b = h("button", { class: `btn btn-sm ${cls || ""}`.trim(), type: "button" }, parent, text);
  if (onClick) b.addEventListener("click", onClick);
  return b;
}
const shortGate = (name) => name.replace(/\s*\(.*\)$/, "");

/* ---------------- views ---------------- */

function render(data) {
  current = data;
  clearTimeout(pollTimer);
  root.textContent = "";
  if (data.view === "forecast") renderForecastView(data);
  else if (data.view === "proposal") renderProposal(data);
  else if (data.view === "scenario") renderScenario(data);
  else h("div", { class: "text-sm" }, root, "Nothing to show.");
}

function renderForecastView(d) {
  const ev = d.event, sc = d.scenario, fc = d.forecast;
  header(`${ev.name}: arrival forecast`, `${ev.weekday} ${ev.date} · ${ev.venue}`,
    sc.kind === "official" ? "Official plan" : "Scenario", sc.kind === "official" ? "badge-primary" : "badge-secondary");
  const t = fc.totals.day;
  h("p", { class: "text-sm text-base-content/85" }, root,
    `Expected total: about ${fmt(t.p50)} guests (80% range: ${fmt(t.p10)} to ${fmt(t.p90)}). The line shows the median per hour; the band shows the 80% range.`);
  const tabs = h("div", { role: "tablist", class: "tabs tabs-box tabs-sm w-fit flex-wrap" }, root);
  const tab = (key, label) => {
    const b = h("button", { role: "tab", type: "button", class: `tab ${gate === key ? "tab-active" : ""}`.trim(), "aria-selected": String(gate === key) }, tabs, label);
    b.addEventListener("click", () => { gate = key; render(current); });
  };
  tab("all", "All entrances");
  for (const s of fc.series) tab(s.gate_id, shortGate(s.gate_name));
  const box = h("div", {}, root);
  if (gate === "all") {
    FC.renderForecast(box, fc, { title: false, table: false, notes: false, legend: true });
  } else {
    const s = fc.series.find((x) => x.gate_id === gate) || fc.series[0];
    if (s.history && s.history.thin) alertBox(root, `Limited history: only ${s.history.days} days of data. Share relevant information about this entrance with Claude.`, "warn");
    FC.renderGate(box, fc, s.gate_id, { strip: true, legend: true, height: 200 });
  }
  const thin = fc.series.filter((s) => s.history && s.history.thin);
  if (gate === "all" && thin.length) alertBox(root, `${thin.map((s) => shortGate(s.gate_name)).join(" and ")} has limited history, so its forecast is less certain. Local knowledge can reduce this uncertainty.`, "warn");
}

function statusLabel(status) {
  return { pending: "Pending confirmation", active: "Applied", rejected: "Rejected", removed: "Removed" }[status] || status;
}

function renderProposal(d) {
  const c = d.constraint;
  header("Proposed change", d.event ? `${d.event.name} · ${d.event.date}` : "", statusLabel(c.status),
    c.status === "pending" ? "badge-warning" : c.status === "active" ? "badge-success" : "badge-ghost");
  const b = cardBody(root, c.status === "pending" ? "border-secondary" : "");
  if (c.note) {
    h("div", { class: "text-xs font-semibold uppercase text-base-content/70" }, b, "Original note");
    h("blockquote", { class: "border-l-4 border-secondary pl-3 italic" }, b, `“${c.note.text}”`);
  }
  h("div", { class: "text-xs font-semibold uppercase text-base-content/70" }, b, "Interpretation");
  h("p", { class: "font-semibold" }, b, c.readback);
  if (c.interpretation && c.interpretation !== c.readback) h("p", { class: "text-sm text-base-content/75" }, b, c.interpretation);
  if (c.assumptions && c.assumptions.length) {
    const det = h("details", { class: "collapse collapse-arrow bg-base-200" }, b);
    h("summary", { class: "collapse-title text-sm font-semibold" }, det, `Assumptions (${c.assumptions.length})`);
    const ul = h("ul", { class: "collapse-content list-disc pl-8 text-sm" }, det);
    for (const a of c.assumptions) h("li", {}, ul, a);
  }
  h("p", { class: "text-xs text-base-content/70" }, b, d.target ? `Will be added to the scenario “${d.target.name}”.` : "Will be added to a new scenario; the official plan is not affected.");
  if (c.status !== "pending") {
    alertBox(b, c.status === "rejected" ? `Rejected${c.decision_reason ? ": " + c.decision_reason : "."}` : `Already ${statusLabel(c.status).toLowerCase()}.`, c.status === "rejected" ? "" : "ok");
    return;
  }
  const actions = h("div", { class: "card-actions items-center" }, b);
  const ok = button(actions, "Confirm", "btn-primary");
  const no = button(actions, "Reject", "btn-ghost");
  h("span", { class: "text-xs text-base-content/70" }, actions, "No changes apply until you confirm.");
  const msg = h("div", {}, b);
  ok.addEventListener("click", async () => {
    ok.disabled = no.disabled = true;
    ok.prepend(h("span", { class: "loading loading-spinner loading-xs" }));
    try {
      const state = await call("confirm_constraint", { constraint_id: c.id });
      await tellClaude(`The planner CONFIRMED constraint ${c.id} (${c.readback}). It is now in what-if "${state.scenario.name}" [${state.scenario.id}], which is being re-optimized. Use get_scenario_result to discuss the outcome.`);
      render({ view: "scenario", ...state });
    } catch (e) { ok.disabled = no.disabled = false; msg.textContent = ""; alertBox(msg, e.message, "error"); }
  });
  no.addEventListener("click", () => {
    actions.textContent = "";
    const input = h("input", { class: "input input-sm w-full max-w-xs", type: "text", placeholder: "Correct interpretation (optional)", "aria-label": "Reason" }, actions);
    const send = button(actions, "Reject", "btn-error btn-soft");
    button(actions, "Cancel", "btn-ghost", () => render(current));
    input.focus();
    send.addEventListener("click", async () => {
      send.disabled = true;
      try {
        const out = await call("reject_constraint", { constraint_id: c.id, reason: input.value });
        await tellClaude(`The planner REJECTED constraint ${c.id} (${c.readback})${input.value ? ": " + input.value : ""}. Ask how to read their note instead.`);
        render({ ...current, constraint: out.constraint });
      } catch (e) { send.disabled = false; alertBox(msg, e.message, "error"); }
    });
  });
}

function renderScenario(d) {
  const ev = d.event, sc = d.scenario, run = d.run;
  header(sc.kind === "official" ? "Official plan" : sc.name, `${ev.name} · ${ev.weekday} ${ev.date}`,
    sc.kind === "official" ? "Official plan" : sc.status === "active" ? "Scenario" : sc.status, sc.kind === "official" ? "badge-primary" : "badge-secondary");

  const running = run && (run.status === "queued" || run.status === "running");
  if (running) {
    const b = cardBody(root);
    const row = h("div", { class: "flex items-center gap-2 text-sm" }, b);
    h("span", { class: "loading loading-spinner loading-sm" }, row);
    h("span", {}, row, run.stage === "forecast" ? "Updating the forecast…" : "Optimizing staffing plans…");
    h("progress", { class: "progress progress-secondary w-full", value: String(Math.round((run.stage === "optimize" ? 0.2 + 0.8 * run.progress : 0.1) * 100)), max: "100" }, b);
    pollTimer = setTimeout(refresh, 1500);
  } else if (run && run.status === "failed") {
    alertBox(root, `Calculation failed: ${run.error}`, "error");
  }

  if (d.constraints.length) {
    const b = cardBody(root);
    h("div", { class: "text-xs font-semibold uppercase text-base-content/70" }, b, "Changes in this scenario");
    const ul = h("ul", { class: "list-disc space-y-1 pl-5 text-sm" }, b);
    for (const c of d.constraints) {
      const li = h("li", {}, ul, c.readback);
      if (c.note) h("div", { class: "text-xs italic text-base-content/70" }, li, `“${c.note.text}”`);
    }
  }
  if (d.pending.length) alertBox(root, `${d.pending.length} more proposed change${d.pending.length > 1 ? "s" : ""} awaiting confirmation.`);

  if (!d.result) { if (!running) h("div", { class: "text-sm" }, root, "No result yet."); return; }
  const sel = d.selected_solution;
  if (d.result.service_cap_met === false) alertBox(root, `Under these changes, no plan keeps the average wait below ${d.result.max_expected_wait} minutes. The plans shown are the best available.`, "warn");

  if (sel) {
    const stats = h("div", { class: "stats stats-vertical w-full border border-base-300 bg-base-100 sm:stats-horizontal" }, root);
    const stat = (title, value, desc) => { const s = h("div", { class: "stat py-3" }, stats); h("div", { class: "stat-title" }, s, title); h("div", { class: "stat-value text-2xl" }, s, value); h("div", { class: "stat-desc" }, s, desc); };
    stat("Staff cost", eur(sel.staff_cost), `${sel.staff_hours} staff-hours`);
    stat("Average wait", `${fmt1(sel.expected_wait)} min`, "per guest");
    stat("P90 wait", `${fmt1(sel.wait_p90)} min`, "Exceeded on 1 day in 10");
    if (d.comparison) {
      const c = d.comparison;
      const more = c.delta_staff_hours >= 0 ? `${c.delta_staff_hours} more` : `${-c.delta_staff_hours} fewer`;
      const wait = c.delta_expected_wait <= 0 ? `${fmt1(-c.delta_expected_wait)} min shorter` : `${fmt1(c.delta_expected_wait)} min longer`;
      alertBox(root, `Compared with the official plan: ${more} staff-hours (${c.delta_staff_cost >= 0 ? "+" : "−"}${eur(Math.abs(c.delta_staff_cost))}); average wait ${wait}.`);
    }
  }

  const editable = d.editable && !running && !d.result_is_stale;
  const tb = cardBody(root);
  h("div", { class: "font-semibold" }, tb, "Candidate plans");
  h("p", { class: "text-xs text-base-content/70" }, tb, editable
    ? "Each point is a plan. Plans further right cost more; lower plans have shorter queues. Select a point to choose that plan."
    : "Each point is a plan. Plans further right cost more; lower plans have shorter queues.");
  const tradeoff = h("div", {}, tb);
  FC.renderTradeoff(tradeoff, d.result, {
    title: false,
    selectedId: sc.selected_solution_id,
    official: d.comparison ? d.comparison.official : null,
    editable,
    onSelect: async (id) => {
      try {
        const state = await call("select_plan", { scenario_id: sc.id, solution_id: id });
        render({ view: "scenario", ...state });
        const s = state.selected_solution;
        await tellClaude(`The planner selected plan ${id} in "${sc.name}": ${s.staff_hours} staff-hours, EUR ${Math.round(s.staff_cost)}, expected wait ${fmt1(s.expected_wait)} min.`);
      } catch (e) { alertBox(root, e.message, "error"); }
    },
  });

  if (sel) {
    const det = h("details", { class: "collapse collapse-arrow border border-base-300 bg-base-100" }, root);
    h("summary", { class: "collapse-title text-sm font-semibold" }, det, "Staffing schedule");
    const box = h("div", { class: "collapse-content" }, det);
    det.addEventListener("toggle", () => { if (det.open && !box.firstChild) FC.renderSchedule(box, sel, d.result, ev.gates, { title: false }); });
  }

  const act = h("div", { class: "flex flex-wrap items-center gap-2" }, root);
  if (d.editable && sel && !running && !d.result_is_stale) {
    const promote = button(act, "Adopt as official plan…", "btn-primary");
    promote.addEventListener("click", () => {
      act.textContent = "";
      const b = cardBody(act, "w-full border-primary");
      h("div", { class: "font-bold" }, b, "Adopt this plan?");
      h("p", { class: "text-sm" }, b,
        `“${sc.name}” (${sel.staff_hours} staff-hours, ${eur(sel.staff_cost)}, average wait about ${fmt1(sel.expected_wait)} min) will become the official plan. The current plan remains in the activity log.`);
      const row = h("div", { class: "card-actions" }, b);
      const yes = button(row, "Adopt plan", "btn-primary");
      button(row, "Cancel", "btn-ghost", () => render(current));
      yes.addEventListener("click", async () => {
        yes.disabled = true;
        try {
          const state = await call("promote_scenario", { scenario_id: sc.id, solution_id: sel.id });
          await tellClaude(`The planner PROMOTED "${sc.name}" [${sc.id}] with plan ${sel.id} to the official plan (${sel.staff_hours} staff-hours, EUR ${Math.round(sel.staff_cost)}, expected wait ${fmt1(sel.expected_wait)} min).`);
          render({ view: "scenario", ...state });
        } catch (e) { yes.disabled = false; alertBox(b, e.message, "error"); }
      });
    });
  }
  button(act, "Refresh", "", refresh);
}

async function refresh() {
  if (!current || current.view !== "scenario") return;
  try {
    const state = await call("get_scenario_state", { scenario_id: current.scenario.id });
    const wasRunning = current.run && (current.run.status === "queued" || current.run.status === "running");
    render({ view: "scenario", ...state });
    if (wasRunning && state.run && state.run.status === "done" && state.selected_solution) {
      const s = state.selected_solution;
      await tellClaude(`Re-optimization of "${state.scenario.name}" finished. Balanced plan ${s.id}: ${s.staff_hours} staff-hours, EUR ${Math.round(s.staff_cost)}, expected wait ${fmt1(s.expected_wait)} min. Call get_scenario_result for the full trade-off.`);
    }
  } catch (e) { alertBox(root, e.message, "error"); }
}

app.ontoolresult = (result) => {
  if (result.isError) { root.textContent = ""; alertBox(root, textOf(result), "error"); return; }
  if (result.structuredContent) render(result.structuredContent);
};
app.onhostcontextchanged = applyContext;
app.onteardown = async () => { clearTimeout(pollTimer); return {}; };

await app.connect();
applyContext(app.getHostContext());
</script>
</body>
</html>
