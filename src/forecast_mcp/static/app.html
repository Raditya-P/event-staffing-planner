<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Staffing Planner</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/brand/logo.svg" type="image/svg+xml">
<link rel="icon" href="/static/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
</head>
<body class="min-h-screen bg-base-100">
<div class="drawer lg:drawer-open">
  <input id="nav-drawer" type="checkbox" class="drawer-toggle" aria-label="Open the menu">
  <div class="drawer-content flex min-h-screen flex-col">
    <!-- One bar: menu button, the event and scenario being viewed, then status, help and account.
         Below lg the pickers wrap onto a second line. -->
    <header class="sticky top-0 z-20 flex flex-wrap items-center gap-x-2 gap-y-2 border-b border-base-300 bg-base-100 px-3 py-2 sm:px-4 lg:h-16 lg:flex-nowrap lg:py-0">
      <label for="nav-drawer" class="btn btn-ghost btn-square btn-sm lg:hidden" aria-label="Open the menu">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </label>
      <a href="#/home" class="flex items-center gap-2 text-lg lg:hidden"><img src="/static/brand/logo.svg" class="size-7" alt=""><span class="brand-name">Staffing <span class="text-primary">Planner</span></span></a>
      <button id="sidebar-toggle" type="button" class="btn btn-ghost btn-square btn-sm hidden lg:inline-flex" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse the sidebar" title="Collapse the sidebar">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <span class="mx-1 hidden h-6 w-px bg-base-300 lg:block" aria-hidden="true"></span>

      <div class="order-last flex w-full min-w-0 items-center gap-2 lg:order-none lg:w-auto lg:flex-1">
        <label class="select select-sm min-w-0 flex-[3] lg:max-w-72">
          <span class="label max-sm:sr-only">Event</span>
          <select id="event-select" class="min-w-0 appearance-none! font-medium"></select>
        </label>
        <label class="select select-sm min-w-0 flex-[2] lg:max-w-72">
          <span class="label max-sm:sr-only">Scenario</span>
          <select id="scenario-select" class="min-w-0 appearance-none! font-medium"></select>
        </label>
      </div>

      <div class="ml-auto flex items-center gap-1.5">
        <span id="run-status" class="inline-flex items-center gap-2 rounded-full border border-info/40 bg-info/10 px-2.5 py-1 text-xs font-medium" hidden><span class="loading loading-spinner loading-xs text-info"></span><span class="hidden sm:inline">Updating plans</span></span>
        <span id="sync" class="hidden items-center gap-2 sm:inline-flex rounded-full border border-base-300 px-2.5 py-1 text-xs text-base-content/75" aria-live="polite"><span class="status status-success"></span><span>Up to date</span></span>
        <button id="help-btn" class="btn btn-ghost btn-circle btn-sm" type="button" aria-label="About this page" title="About this page">
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg>
        </button>
        <div class="dropdown dropdown-end">
          <div tabindex="0" role="button" class="btn btn-ghost btn-circle btn-sm" aria-label="Account" title="Account">
            <div class="avatar avatar-placeholder">
              <div class="w-8 rounded-full bg-secondary text-secondary-content"><span id="initials" class="text-xs font-semibold">·</span></div>
            </div>
          </div>
          <ul tabindex="0" class="menu dropdown-content z-30 mt-2 w-64 rounded-box border border-base-300 bg-base-100 p-2 shadow-lg">
            <li class="menu-title px-3 pb-2">
              <span class="block text-xs font-normal text-base-content/70">Signed in as</span>
              <span id="who" class="block truncate font-semibold text-base-content">Local user</span>
            </li>
            <li><a href="#/claude">Claude integration</a></li>
            <li id="reset-item"><button type="button" id="reset-btn">Reset workspace</button></li>
            <li id="signout-item"><a href="/logout">Sign out</a></li>
          </ul>
        </div>
      </div>
    </header>

    <main id="page" class="mx-auto w-full max-w-5xl flex-1 px-4 py-6" tabindex="-1"></main>
  </div>

  <div class="drawer-side z-30">
    <label for="nav-drawer" aria-label="Close the menu" class="drawer-overlay"></label>
    <aside id="sidebar" class="flex min-h-full w-64 flex-col border-r border-base-300 bg-base-200">
      <a href="#/home" class="sidebar-brand flex h-16 shrink-0 items-center gap-2.5 border-b border-base-300 px-5 text-xl" aria-label="Overview">
        <img src="/static/brand/logo.svg" class="size-9" alt="">
        <span class="brand-name">Staffing <span class="text-primary">Planner</span></span>
      </a>
      <ul class="menu w-full gap-1 px-3 pt-3" id="nav"></ul>
      <div class="sidebar-note mt-auto p-4">
        <a href="#/about" class="alert alert-soft text-xs">Research prototype using synthetic data. About this prototype.</a>
      </div>
    </aside>
  </div>
</div>

<dialog id="explain" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold" id="explain-title"></h3>
    <div class="py-3 space-y-2 text-base-content/85" id="explain-body"></div>
    <div class="modal-action">
      <a class="btn btn-ghost" id="explain-more" href="#/learn">Open guide</a>
      <form method="dialog"><button class="btn">Close</button></form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<dialog id="confirm" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold" id="confirm-title"></h3>
    <div class="py-3 text-base-content/85" id="confirm-body"></div>
    <div class="modal-action">
      <form method="dialog"><button class="btn btn-ghost" value="cancel">Cancel</button></form>
      <button class="btn btn-primary" type="button" id="confirm-yes">Yes</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<dialog id="change" class="modal">
  <div class="modal-box max-w-xl" id="change-box"></div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<dialog id="explainer" class="modal modal-bottom sm:modal-middle" aria-labelledby="ex-title">
  <div class="modal-box max-w-3xl p-0">
    <div class="flex items-center justify-between gap-3 border-b border-base-300 px-6 py-4">
      <h3 class="text-lg font-bold" id="ex-title"></h3>
      <form method="dialog"><button class="btn btn-ghost btn-sm">Close</button></form>
    </div>
    <div class="space-y-4 px-6 pt-4">
      <ul class="steps w-full text-xs *:min-w-0" id="ex-steps" aria-label="Explanation steps"></ul>
      <div class="space-y-3" id="ex-body" aria-live="polite"></div>
    </div>
    <div class="mt-4 flex items-center justify-between border-t border-base-300 px-6 py-4">
      <button class="btn btn-ghost" type="button" id="ex-back">Back</button>
      <span class="text-sm text-base-content/70" id="ex-count"></span>
      <button class="btn btn-primary" type="button" id="ex-next">Next</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<div class="toast toast-end toast-bottom z-50" id="toasts" aria-live="polite"></div>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
